<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="aresBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="aresGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#7f52ff" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="340" rx="16" fill="url(#aresBg)" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Terminal Header Bar -->
  <rect x="0" y="0" width="600" height="42" rx="16" fill="#0b1120"/>
  <rect x="0" y="24" width="600" height="18" fill="#0b1120"/>
  <line x1="0" y1="42" x2="600" y2="42" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="24" cy="21" r="5" fill="#ef4444" />
  <circle cx="42" cy="21" r="5" fill="#f59e0b" />
  <circle cx="60" cy="21" r="5" fill="#10b981" />
  <text x="300" y="26" text-anchor="middle" fill="#64748b" font-family="'Fira Code', monospace" font-size="12" font-weight="600">ares-terminal-daemon • local-pipeline</text>

  <!-- Glowing Emblem / Logo -->
  <g transform="translate(300, 125)">
    <polygon points="0,-45 40,30 -40,30" fill="none" stroke="url(#aresGlow)" stroke-width="3" filter="url(#neon)"/>
    <circle cx="0" cy="8" r="8" fill="#00f2fe" filter="url(#neon)"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="300" y="210" text-anchor="middle" fill="#f8fafc" font-family="'Fira Code', monospace" font-size="24" font-weight="700" letter-spacing="3">A. R. E. S.</text>
  <text x="300" y="235" text-anchor="middle" fill="#00f2fe" font-family="'Fira Code', monospace" font-size="13" font-weight="600">AUTONOMOUS EXECUTIVE TERMINAL AI</text>
  
  <!-- System Spec Tags -->
  <g transform="translate(140, 265)">
    <rect x="0" y="0" width="95" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="47" y="17" text-anchor="middle" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="10">Local-First</text>

    <rect x="110" y="0" width="105" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="162" y="17" text-anchor="middle" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="10">Neural TTS</text>

    <rect x="230" y="0" width="95" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="277" y="17" text-anchor="middle" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="10">Zero-Leak</text>
  </g>

  <!-- Bottom Pulse Line -->
  <line x1="30" y1="315" x2="570" y2="315" stroke="url(#aresGlow)" stroke-width="1" opacity="0.6"/>
</svg>
